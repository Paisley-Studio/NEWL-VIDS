name: Render training videos

# Renders the NEWL AFRICA training lessons with Remotion on GitHub-hosted runners.
# Trigger: Actions tab → "Render training videos" → Run workflow
#   or:    gh workflow run render-training.yml -f lessons=all -f publish=true
on:
  workflow_dispatch:
    inputs:
      lessons:
        description: Which lesson(s) to render
        type: choice
        default: all
        options: [all, lesson-01, lesson-02, lesson-03, lesson-04, lesson-05, lesson-06]
      regenerate_narration:
        description: Re-synthesise narration before rendering (only needed after script edits that weren't regenerated locally)
        type: boolean
        default: false
      preview:
        description: Fast half-resolution preview (not for publishing)
        type: boolean
        default: false
      publish:
        description: Publish to the "training-videos" release and redeploy the learning centre
        type: boolean
        default: false

permissions:
  contents: write   # create/update the release
  pages: write      # redeploy the learning centre
  id-token: write

concurrency:
  group: render-training
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare narration, subtitles and checks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install -r scripts/production/requirements.txt
      - name: Regenerate narration (edge-tts)
        if: inputs.regenerate_narration
        run: npm run narration
      - name: Export timeline, subtitles and site data
        run: npm run export
      - name: Production checks (assets, subtitles, no credentials)
        run: npm run verify
      - name: Type-check
        run: npm run lint
      - id: matrix
        run: |
          if [ "${{ inputs.lessons }}" = "all" ]; then
            echo 'matrix=["lesson-01","lesson-02","lesson-03","lesson-04","lesson-05","lesson-06"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["${{ inputs.lessons }}"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          retention-days: 3
          path: |
            src/generated/
            public/audio/narration/
            data/
            subtitles/
            resources/

  render:
    name: Render ${{ matrix.lesson }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        lesson: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: prepared, path: . }
      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 \
            libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          # full ffmpeg build: Remotion's bundled one cannot embed the subtitle track
          sudo apt-get install -y --no-install-recommends ffmpeg
          npx remotion browser ensure
      - name: Render, mux subtitles, validate
        run: |
          EXTRA=""
          if [ "${{ inputs.preview }}" = "true" ]; then EXTRA="--scale=0.5 --crf=26"; fi
          node scripts/production/render.mjs --lessons=${{ matrix.lesson }} $EXTRA
      - name: Stage files for upload
        run: |
          n=$(echo "${{ matrix.lesson }}" | sed 's/lesson-//')
          mkdir -p upload
          cp "videos/${{ matrix.lesson }}/newl-africa-lesson-$n.mp4" upload/
          cp "videos/${{ matrix.lesson }}/poster.jpg" "upload/newl-africa-lesson-$n-poster.jpg"
          cp "subtitles/${{ matrix.lesson }}.en.srt" "subtitles/${{ matrix.lesson }}.en.vtt" upload/
          cp videos/manifest.json "upload/manifest-${{ matrix.lesson }}.json"
          ls -la upload
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.lesson }}
          path: upload/
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish to release
    needs: render
    if: inputs.publish && !inputs.preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: video-*, path: release, merge-multiple: true }
      - name: Create or update the training-videos release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view training-videos >/dev/null 2>&1 || \
            gh release create training-videos --title "NEWL AFRICA training videos" \
              --notes "Rendered lessons of the NEWL AFRICA Digital System Training. Updated by the Render training videos workflow."
          gh release upload training-videos release/* --clobber
          gh release view training-videos --json assets --jq '.assets[] | "\(.name)\t\(.size)"'

  deploy:
    name: Redeploy learning centre
    needs: publish
    uses: ./.github/workflows/deploy-learning-centre.yml
